{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
<title>{{.Title}} · Volarr</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script src="/static/app.js"></script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
{{if .Nav}}
<header class="top">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="22" height="22"> Volarr</a>
  <nav aria-label="Main">
    <a href="/" {{if eq .Nav "search"}}aria-current="page"{{end}}>Search</a>
    <a href="/queue" {{if eq .Nav "queue"}}aria-current="page"{{end}}>Queue</a>
    <a href="/settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>Settings</a>
  </nav>
  <button class="btn ghost small" type="button" data-theme-toggle hidden><svg class="icon icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="icon icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span data-theme-label>Light mode</span></button>
  {{if .AuthEnabled}}<form method="post" action="/logout" class="logout"><button class="btn ghost small" type="submit">Log out</button></form>{{end}}
</header>
{{end}}
<main>
{{if and .Nav (ne .Nav "settings") (not .Ready)}}<div class="alert warn">Finish setup in <a href="/settings">Settings</a>: add the animepahe URL and FlareSolverr.</div>{{end}}
{{template "content" .}}
</main>
<footer class="muted">Volarr {{version}}</footer>
</body>
</html>{{end}}
