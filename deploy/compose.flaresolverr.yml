# Optional overlay; use together with compose.release.yml.
services:
  pahe-arr:
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
    depends_on:
      flaresolverr:
        condition: service_healthy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1:8191/"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
