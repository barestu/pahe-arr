name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      image: ${{ steps.tag.outputs.image }}
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            # Do not let an older stable release roll back latest.
            NEWEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ "$TAG" == "$NEWEST" ]]; then
              echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Create release and portable Compose installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ${{ needs.validate.outputs.image }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          sed "s|ghcr.io/barestu/pahe-arr:latest|$IMAGE:$VERSION|" deploy/compose.release.yml > compose.release.yml
          cp deploy/compose.flaresolverr.yml compose.flaresolverr.yml
          sha256sum compose.release.yml compose.flaresolverr.yml > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            EXTRA=()
            if [[ "$PRERELEASE" == true ]]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${EXTRA[@]}" compose.release.yml compose.flaresolverr.yml SHA256SUMS
          else
            gh release upload "$TAG" compose.release.yml compose.flaresolverr.yml SHA256SUMS --clobber
          fi
