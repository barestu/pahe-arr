# Build and start:   sudo docker compose up -d --build
# Web UI:            http://<server-ip>:8585
# CLI inside it:     sudo docker compose exec pahe-arr pahe doctor
name: pahe-arr
services:
  pahe-arr:
    build: .
    image: pahe-arr:local
    container_name: pahe-arr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=${TZ:-UTC}
      - PAHE_PASSWORD=${PAHE_PASSWORD:?Create a .env file with PAHE_PASSWORD=yourpassword}
      - PAHE_DOMAIN=${PAHE_DOMAIN:-}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-}
      - PAHE_OUTPUT_DIR=/config/downloads
    volumes:
      - "${PAHE_HOST_CONFIG_DIR:-./data/config}:/config"
      - "${PAHE_HOST_DOWNLOAD_DIR:-./data/downloads}:/config/downloads"
    ports:
      - "8585:8585"
    restart: unless-stopped
